name: Release to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
      release_notes:
        description: 'What changed in this release'
        required: true

# Never let two Play Store releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod                    # ← requires manual approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Write PROD google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/mypet360.keystore
          cat > android/key.properties << PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=mypet360.keystore
          PROPS

        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build PROD App Bundle
        env:
          BUILD_NAME: ${{ github.event.inputs.version }}
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }}

      - name: Upload to Play Store internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.mypet360.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          releaseName: v${{ github.event.inputs.version }}
          status: inProgress            # ← required whenever userFraction is set
          userFraction: '0.1'           # ← rolls out to 10% of users first
