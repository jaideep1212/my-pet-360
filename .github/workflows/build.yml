name: Build & Deploy

on:
  push:
    branches: [main]
  # Lets you run this workflow by hand from the Actions tab, so changes to
  # this file can be tested without merging to main first.
  workflow_dispatch:

# Only one deploy per branch at a time. cancel-in-progress is false on
# purpose — killing a run mid-upload could leave a half-published release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build TEST APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test                    # ← uses test environment secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Write TEST google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build TEST APK
        run: |
          flutter build apk --release \
            --flavor test \
            --target lib/main_test.dart \
            --build-number=${{ github.run_number }}

      - name: Distribute to Firebase App Distribution (TEST)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: test-testers
          file: build/app/outputs/flutter-apk/app-test-release.apk
          releaseNotes: |
            🧪 TEST BUILD
            Commit: ${{ github.event.head_commit.message || github.sha }}
            Build: ${{ github.run_number }}

  build-prod:
    name: Build PROD App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test                    # ← only runs after TEST succeeds
    environment: prod                    # ← requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Write PROD google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/mypet360.keystore
          cat > android/key.properties << PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=mypet360.keystore
          PROPS

      - name: Install dependencies
        run: flutter pub get

      - name: Build PROD App Bundle
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --build-number=${{ github.run_number }}

      - name: Distribute to Firebase App Distribution (PROD beta)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: prod-testers
          file: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          releaseNotes: |
            🚀 PROD BUILD
            Commit: ${{ github.event.head_commit.message || github.sha }}
            Build: ${{ github.run_number }}
